[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-stream-recharge-guard"
version = "0.1.0"
description = "Keep media processing jobs moving through automatic balance recharge and creator email delivery."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
